[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pointpca3"
version = "1.0.0"
description = "A Rust-based Python library for extracting pointpca3 features from Point Clouds."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26", "toml>=0.10.0"]

[project.urls]
repository = "https://github.com/arthurhscarvalho/pointpca3-pylib"

[tool.maturin]
python-source = "python"

[dependency-groups]
dev = [
    "maturin>=1.8.3",
    "patchelf>=0.17.2.2",
    "ruff>=0.11.3",
]
